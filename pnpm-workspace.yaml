packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  lightningcss: true

catalog:
  '@prisma/client': 7.10.1
  '@types/node': ^24
  dotenv: ^18.0.9
  prisma: 7.10.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  wrangler: ^4.152.0

catalogMode: prefer

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
